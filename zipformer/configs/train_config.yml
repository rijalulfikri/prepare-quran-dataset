# Training configuration for Zipformer2-CTC (causal, icefall "medium" dims)

# ---- data ----
train_moshaf_ids:
  - "0.0"
  - "0.1"
  - "0.2"
  - "0.3"
  - "1.0"
  - "2.0"
  - "2.1"
  - "3.0"
  - "4.0"
  - "5.0"
  - "6.0"
  - "7.0"
  - "8.0"
  - "9.0"
  - "11.0"
  - "12.0"
  - "13.0"
  - "22.0"
  - "24.0"
  - "26.0"
  - "26.1"
  - "27.0"
  - "28.0"
test_moshaf_ids:
  - "19.0"
  - "29.0"
  - "30.0"
devset_ratio: 0.1              # fraction of train cuts held out as dev
seed: 42
max_audio_seconds: null        # drop cuts longer than this (null = keep all)
noise_aug_ratio: 0.3           # fraction of noise cuts mixed in (data prep)
max_noise_input_seconds: 40.0  # upper bound of noise input length
min_noise_input_seconds: 1.0   # lower bound of noise input length
data_dir: "./data-zipformer"
rclone_remote_path: "utluma:RClone/Utluma/zipformer-data"
# data_dir as tar shards, tried in order: HF, then Drive, then rclone sync of raw files (null skips a source)
hf_data_repo: "rijalulfikri/utluma-zipformer-data"
drive_data_shards_path: "utluma:RClone/Utluma/zipformer-shards"

# ---- model (comma lists: one entry per encoder stack) ----
num_encoder_layers: "2,2,3,4,3,2"
downsampling_factor: "1,2,4,8,4,2"
feedforward_dim: "512,768,1024,1536,1024,768"
num_heads: "4,4,4,8,4,4"
encoder_dim: "192,256,384,512,384,256"
query_head_dim: "32"
value_head_dim: "12"
pos_head_dim: "4"
pos_dim: 48
encoder_unmasked_dim: "192,192,256,256,256,192"
cnn_module_kernel: "31,31,15,15,15,31"
output_downsampling_factor: 1  # 20 ms frames; deliberately differs from v3 (40 ms) for CTC blank headroom
causal: true
chunk_size: "8,16,24"          # chunk sizes sampled during training
left_context_frames: "72,128,256"  # every chunk * (left // chunk) must be >= 56 (icefall assert)
feature_dim: 80                # fbank bins

# ---- training ----
max_duration: 600              # seconds of audio per batch
num_workers: 24                # fbank/CutMix/speed perturb run on the fly in workers; leave a few cores for the main process
num_epochs: 30
base_lr: 0.045
lr_batches: 7500
lr_epochs: 3.5
warmup_batches: 500
keep_last_k: 3                 # kept separately for checkpoint-*.pt and epoch-*.pt
avg_last_k: 3                  # epochs averaged for the final model
bf16: true
log_every: 50
dev_max_cuts: 2000             # cap on legacy dev cuts evaluated (null = all)
# New run name: the v0 run (Drive folder utluma-zipformer-ctc-v0) is finished; reusing its
# output_dir / rclone_checkpoint_path would resume from its epoch 30 and only re-average
output_dir: "./results-zipformer-v1"

# ---- augmentation (config.py defaults = the v0 pipeline: speed 0.9/1.0/1.1, CutMix 10-20 dB) ----
# Each block answers a weakness the robustness audit measured in v0 against the
# reference model (README, "Audit ketahanan v0"); the stress sets below track them per epoch.
speed_perturb: true
speed_factor_ranges:           # one static copy per range; factor drawn per cut on a 0.05 grid
  - [0.85, 0.95]
  - [1.0, 1.0]
  - [1.05, 1.3]                # faster and higher-pitched than any train reciter (v0: 1.1)
tempo_p: 0.3                   # share of batches played faster without pitch change (fbank frames resampled)
tempo_range: [1.0, 1.4]        # v0 at tempo 1.5: PER 7.6 %, reference 1.0 %
cutmix_p: 0.5
cutmix_snr: [5.0, 20.0]        # v0: [10, 20]
reverb_p: 0.3                  # simulated-RIR reverb on the speech, before the noise mix
volume_p: 0.6                  # gain uniform in dB, after the noise mix (quiet microphone)
volume_db: [-40.0, 6.0]        # v0 at -30 dB: PER 23 %, at -40 dB: 54 % (reference: below 1 %)
clip_p: 0.1                    # hard clipping at a fraction of the peak (overdriven microphone)
clip_peak_fraction: [0.05, 0.5]
# Non-speech before / after the recitation: v0 never saw more than 0.93 s of it before speech
# and drops the first words after a longer stretch
pad_p: 0.3                     # share of speech cuts that get it; lengths redrawn every epoch
pad_lead_seconds: [0.5, 4.0]
pad_trail_seconds: [0.0, 2.0]
nonspeech_noise_p: 0.75        # such a stretch (and a joined cut's gap) holds noise, else digital silence
nonspeech_snr: [10.0, 45.0]    # speech level over that noise, dB
# Joined consecutive segments: the app hears continuous recitation, and v0 loses the start
# of most ayat after the pause before them (stream of 7 ayat: PER 7 %, reference 0 %)
concat_p: 0.3                  # chance a run of consecutive segments of one sura starts at a cut
concat_segments: [2, 4]        # segments per joined cut
concat_gap_seconds: [0.0, 1.5] # extra non-speech at each join, on top of the segments' own pauses
concat_max_seconds: 45.0       # a run stops growing before its speech gets longer than this
# CR-CTC: off, for a separate comparison run (README)
use_cr_ctc: false              # two SpecAugment views + consistency loss; ~2x compute per batch
cr_loss_scale: 0.2
cr_time_mask_ratio: 2.5
cr_warm_steps: 2000

# ---- per-epoch eval sets (one dev_metrics.jsonl row per epoch, see README) ----
dev_unseen_cuts_per_moshaf: 1000   # fixed sample of cuts_test (moshaf 19.0, 29.0, 30.0)
eval_qdat: true                # obadx/qdat_bench, 159 phone clips, eval only
# perturbed copies of the dev_unseen sample, one per weakness (eval_sets.py)
stress_sets: ["vol-20db", "vol-35db", "reverb", "speed1.25", "clip", "lead-noise", "pair-gap"]
early_stop_metric: "dev_unseen/per_phonemes"   # key the watchdog's new-best rule follows; not QDAT (159 clips, too noisy: v1 epochs 1-4 went 22.9/22.4/23.5/19.3 while dev_unseen fell every epoch)

# ---- eval / export ----
export_chunk_size: 24          # must be one of chunk_size
export_left_context: 256
hub_model_id: "rijalulfikri/utluma-zipformer-ctc-v1"
wandb_project_name: "utluma-zipformer-ctc-v1"

# ---- frame budget ----
max_dropped_fraction: 0.01     # abort train if more speech cuts fail the CTC frame check

# ---- fault tolerance ----
save_every_n_batches: 2000
rclone_checkpoint_path: "utluma-edit:RClone/Utluma/zipformer-data/checkpoints/utluma-zipformer-ctc-v1"  # null disables Drive backup
upload_timeout_seconds: 1800
shutdown_flush_seconds: 120

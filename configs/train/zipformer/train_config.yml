# Training configuration for Zipformer2-CTC (causal, icefall "medium" dims)

# ---- data ----
train_moshaf_ids:
  - "0.0"
  - "0.1"
  - "0.2"
  - "0.3"
  - "1.0"
  - "2.0"
  - "2.1"
  - "3.0"
  - "4.0"
  - "5.0"
  - "6.0"
  - "7.0"
  - "8.0"
  - "9.0"
  - "11.0"
  - "12.0"
  - "13.0"
  - "22.0"
  - "24.0"
  - "26.0"
  - "26.1"
  - "27.0"
  - "28.0"
test_moshaf_ids:
  - "19.0"
  - "29.0"
  - "30.0"
devset_ratio: 0.1              # fraction of train cuts held out as dev
seed: 42
max_audio_seconds: null        # drop cuts longer than this (null = keep all)
noise_aug_ratio: 0.3           # fraction of noise cuts mixed in (data prep)
max_noise_input_seconds: 40.0  # upper bound of noise input length
min_noise_input_seconds: 1.0   # lower bound of noise input length
data_dir: "./data-zipformer"
rclone_remote_path: "gdrive:muaalem-zipformer-data"

# ---- model (comma lists: one entry per encoder stack) ----
num_encoder_layers: "2,2,3,4,3,2"
downsampling_factor: "1,2,4,8,4,2"
feedforward_dim: "512,768,1024,1536,1024,768"
num_heads: "4,4,4,8,4,4"
encoder_dim: "192,256,384,512,384,256"
query_head_dim: "32"
value_head_dim: "12"
pos_head_dim: "4"
pos_dim: 48
encoder_unmasked_dim: "192,192,256,256,256,192"
cnn_module_kernel: "31,31,15,15,15,31"
output_downsampling_factor: 1  # 20 ms frames; deliberately differs from v3 (40 ms) for CTC blank headroom
causal: true
chunk_size: "8,16,24"          # chunk sizes sampled during training
left_context_frames: "64,128,256"
feature_dim: 80                # fbank bins

# ---- training ----
max_duration: 600              # seconds of audio per batch
num_workers: 8
num_epochs: 30
base_lr: 0.045
lr_batches: 7500
lr_epochs: 3.5
warmup_batches: 500
keep_last_k: 3                 # kept separately for checkpoint-*.pt and epoch-*.pt
avg_last_k: 3                  # epochs averaged for the final model
bf16: true
log_every: 50
dev_max_cuts: 2000             # cap on dev cuts evaluated (null = all)
cutmix_p: 0.5
cutmix_snr: [10.0, 20.0]
speed_perturb: true
output_dir: "./results-zipformer-v0"

# ---- eval / export ----
export_chunk_size: 24          # must be one of chunk_size
export_left_context: 256
hub_model_id: "rijalulfikri/utluma-zipformer-ctc-v0"
wandb_project_name: "utluma-zipformer-ctc-v0"

# ---- frame budget ----
max_dropped_fraction: 0.01     # abort train if more speech cuts fail the CTC frame check

# ---- fault tolerance ----
save_every_n_batches: 2000
rclone_checkpoint_path: "gdrive:RClone/Utluma/zipformer-data/checkpoints/utluma-zipformer-ctc-v0"  # null disables Drive backup
upload_timeout_seconds: 1800
shutdown_flush_seconds: 120
